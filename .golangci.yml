run:
  timeout: 3m
  tests: true
  skip-dirs:
    - test/e2e
    - bin
    - vendor
  skip-files:
    - ".*_generated.go"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gofmt
    - revive
    - unused
    - ineffassign
    - deadcode

linters-settings:
  errcheck:
    exclude-functions:
      - 'fmt.Fprintf'
      - 'fmt.Fprintln'

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
