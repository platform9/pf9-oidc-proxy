run:
  timeout: 5m
  concurrency: 1
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - gofmt
    - goimports
    - revive
    - gosimple
    - typecheck

  disable:
    - deadcode
    - gocyclo    
    - dupl       
    - lll        
    - funlen     
    - bodyclose  
    - dogsled    

linters-settings:
  errcheck:
    exclude-functions:
      - fmt.Fprintf
      - fmt.Fprintln
      - log.Printf
      - log.Println

  goimports:
    local-prefixes: github.com/platform9/pf9-oidc-proxy

  gocritic:
    enabled-tags:
      - performance
      - style
      - experimental
    disabled-checks:
      - dupImport
      - rangeValCopy

  revive:
    severity: warning
    rules:
      - name: indent-error-flow
      - name: var-naming
      - name: imports-blacklist
        arguments:
          - fmt
      - name: error-naming
      - name: time-naming

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 3
  exclude-dirs:
    - vendor
    - test/e2e
    - bin
    - mocks
    - generated
  exclude-files:
    - ".*_generated.go"
    - ".*mock_.*.go"
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

output:
  format: colored-line-number
  sort-results: true
